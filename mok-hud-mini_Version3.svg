<svg viewBox="0 0 220 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="M console HUD">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#06320a" stroke-width="0.5"/>
    </pattern>

    <linearGradient id="glowGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#1eff9a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#005a2d" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="scanMask">
      <rect width="100%" height="100%" fill="white"/>
      <g opacity="0.16" fill="black">
        <!-- scanlines spaced tightly for small size -->
        <rect y="0" width="100%" height="1"/>
        <rect y="4" width="100%" height="1"/>
        <rect y="8" width="100%" height="1"/>
        <rect y="12" width="100%" height="1"/>
        <rect y="16" width="100%" height="1"/>
        <rect y="20" width="100%" height="1"/>
        <rect y="24" width="100%" height="1"/>
        <rect y="28" width="100%" height="1"/>
        <rect y="32" width="100%" height="1"/>
        <rect y="36" width="100%" height="1"/>
        <rect y="40" width="100%" height="1"/>
        <rect y="44" width="100%" height="1"/>
      </g>
    </mask>
  </defs>

  <!-- outer frame -->
  <rect x="1" y="1" rx="6" ry="6" width="218" height="46" fill="rgba(0,0,0,0.48)" stroke="#083212" stroke-width="1.5"/>

  <!-- grid panel -->
  <rect x="6" y="6" width="208" height="36" fill="url(#grid)" opacity="0.88"/>

  <!-- glow band (subtle animated band when used inline) -->
  <rect x="-80" y="0" width="120" height="48" fill="url(#glowGrad)" opacity="0.07" class="glow-band"/>

  <!-- glyph group centered -->
  <g transform="translate(110,24)" class="glyph">
    <!-- outer visor -->
    <path d="M-40 -2 L-20 -18 L20 -18 L40 -2 L-40 -2 Z" fill="url(#glowGrad)" opacity="0.78" filter="url(#softBlur)"/>
    <!-- inner triangle -->
    <path d="M0 -16 L-10 6 L10 6 Z" fill="#00ff86"/>
    <!-- lower trapezoid -->
    <path d="M-12 8 L12 8 L6 14 L-6 14 Z" fill="#00b36a" opacity="0.92"/>
  </g>

  <!-- rim highlight -->
  <rect x="4" y="4" rx="5" ry="5" width="212" height="40" fill="none" stroke="rgba(0,255,150,0.06)" stroke-width="1"/>

  <!-- scanlines overlay -->
  <rect x="6" y="6" width="208" height="36" fill="rgba(0,0,0,0.06)" mask="url(#scanMask)"/>
</svg>