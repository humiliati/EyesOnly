<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="An archival command terminal awaiting authenticated input.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="EYES ONLY">
  <meta property="og:description" content="A classified recruitment terminal. Sandpoint, Idaho.">
  <meta property="og:type" content="website">
  <title>EYES ONLY // 1977</title>

  <!-- Preconnect nothing. No external dependencies. -->

  <link rel="stylesheet" href="css/crt.css">

  <!-- Prevent text selection for immersion -->
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    /* Allow selection in input */
    #input-buffer {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- CRT Screen Container -->
  <div id="crt-screen">

    <!-- CRT Effect Layers -->
    <div id="phosphor-glow"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <div id="crt-frame">
      <header id="mok-header" class="monitor-header">
        <div class="mok-header-left">
          <button id="mok-avatar" class="mok-avatar idle" type="button" aria-label="MOK avatar; click to ping advisory link">
            <svg viewBox="0 0 220 120" class="mok-avatar-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="mokHeaderGlow" x1="0" x2="1">
                  <stop offset="0" stop-color="#24ff9e" stop-opacity="0.9"/>
                  <stop offset="1" stop-color="#0a4428" stop-opacity="0.5"/>
                </linearGradient>
                <pattern id="mokHeaderGrid" width="12" height="12" patternUnits="userSpaceOnUse">
                  <path d="M12 0H0V12" fill="none" stroke="#0a2d14" stroke-width="0.6"/>
                </pattern>
              </defs>
              <rect x="6" y="10" width="208" height="72" rx="12" fill="rgba(0,0,0,0.35)" stroke="#0c3c1e" stroke-width="2"/>
              <rect x="14" y="20" width="192" height="52" fill="url(#mokHeaderGrid)" opacity="0.82"/>
              <g transform="translate(110,56)" class="mok-avatar-glyph">
                <path d="M-60 10 L0 -56 L60 10 Z" fill="none" stroke="url(#mokHeaderGlow)" stroke-width="4" stroke-linejoin="round" />
                <path d="M0 -56 L-18 10 L18 10 Z" fill="#21ff90" opacity="0.78" class="mok-avatar-core"/>
                <path d="M-26 22 L26 22 L18 34 L-18 34 Z" fill="#0faa62" opacity="0.8"/>
                <line x1="0" y1="-64" x2="0" y2="-88" stroke="url(#mokHeaderGlow)" stroke-width="3" opacity="0.6"/>
                <line x1="0" y1="38" x2="0" y2="62" stroke="url(#mokHeaderGlow)" stroke-width="3" opacity="0.6"/>
              </g>
            </svg>
          </button>
          <div class="mok-header-copy">
            <div class="mok-header-title">MOK TRIANGLE LINK</div>
            <div class="mok-header-sub">Reactive pentagram avatar · live</div>
          </div>
        </div>
        <div class="mok-header-right">
          <span class="header-chip">mobile safe zone</span>
          <span class="header-chip soft">echo monitor</span>
        </div>
      </header>

      <div id="monitor-shell">
        <div id="monitor-top">
          <div class="mok-banner">
            <svg viewBox="0 0 220 120" class="mok-banner-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="mokBannerGlow" x1="0" x2="1">
                  <stop offset="0" stop-color="#1cff9b" stop-opacity="0.8"/>
                  <stop offset="1" stop-color="#0d3f22" stop-opacity="0.7"/>
                </linearGradient>
              </defs>
              <g transform="translate(110,60)">
                <path d="M-70 20 L0 -70 L70 20 Z" fill="none" stroke="url(#mokBannerGlow)" stroke-width="4" stroke-linejoin="round" opacity="0.8"/>
                <path d="M0 -60 L-22 24 L22 24 Z" fill="rgba(0,255,120,0.12)" class="mok-banner-core"/>
                <line x1="0" y1="-80" x2="0" y2="-118" stroke="url(#mokBannerGlow)" stroke-width="3" opacity="0.5"/>
                <line x1="0" y1="36" x2="0" y2="96" stroke="url(#mokBannerGlow)" stroke-width="3" opacity="0.5"/>
              </g>
            </svg>
          </div>
        </div>

        <div id="monitor-body">
          <aside id="control-rail">
            <div class="control-buttons">
              <button type="button" data-action="help">/help</button>
              <button type="button" data-action="back">back</button>
              <button type="button" data-action="map">map</button>
              <button type="button" data-action="login">login</button>
            </div>
            <div class="debrief-window" id="debrief-window" aria-label="Command and Conquer style debrief feed">
              <div class="debrief-label">debrief feed</div>
              <div class="debrief-screen" id="debrief-screen">
                <span class="debrief-placeholder">4:3 feed standby</span>
              </div>
            </div>
          </aside>

          <section id="log-column">
            <div class="log-frame">
              <!-- Terminal Output -->
              <div id="terminal">

                <!-- Input Line (hidden until activated) -->
                <div id="input-line" style="display: none;">
                  <span id="input-prompt">&gt; </span>
                  <span id="input-buffer"></span>
                  <span id="input-cursor"></span>
                </div>

                <!-- Hidden input for mobile keyboard support -->
                <input id="mobile-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" />

              </div>
            </div>
            <div id="mok-interjections" aria-live="polite">
              <div class="interject-label">MOK INTERJECTION</div>
              <div class="interject-body" id="mok-interject-body">Standing by for advisories.</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- designation obsolete but still required -->

  <!--
    Script load order matches langterm pattern:
    Data/utility modules first, then orchestrator last.
    No build step. No bundler. No framework.
  -->
  <script src="js/terminal.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/street-chronicles.js"></script>
  <script src="js/login-shell.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/state-machine.js"></script>
  <script src="js/main.js"></script>
  <script src="js/mok-ux.js"></script>

</body>
</html>
