<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="An archival command terminal awaiting authenticated input.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="EYES ONLY">
  <meta property="og:description" content="A classified recruitment terminal. Sandpoint, Idaho.">
  <meta property="og:type" content="website">
  <title>EYES ONLY // 1977</title>

  <!-- Preconnect nothing. No external dependencies. -->

  <link rel="stylesheet" href="css/crt.css">
  <link rel="stylesheet" href="css/gone-rogue-mobile.css">

  <!-- Prevent text selection for immersion -->
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    /* Allow selection in input */
    #input-buffer {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- CRT Screen Container -->
  <div id="crt-screen">

    <!-- CRT Effect Layers -->
    <div id="phosphor-glow"></div>
    <div id="scanlines"></div>
    <div id="vignette"></div>

    <div id="crt-frame">
      <header id="mok-header" class="monitor-header">
        <div class="mok-header-copy">
          <div class="mok-header-title">MOK LINK ESTABLISHED</div>
          <div class="mok-header-sub">Spy Games: Red Team <span id="actor-name-display">[actor_name/callsign]</span></div>
        </div>
        <div class="mok-header-center">
          <div id="active-item-slot" class="active-item-slot" title="Active Item - Click to use">
            <span class="active-item-label">ACTIVE ITEM</span>
            <div id="active-item-display" class="active-item-display">
              <span class="empty-slot-indicator">·</span>
            </div>
          </div>
          <div id="currency-display" class="currency-display" title="Cryptos">
            <span class="currency-symbol">¢</span>
            <span id="currency-value" class="currency-value">00000000</span>
          </div>
        </div>
        <div class="mok-header-right">
          <span class="header-chip accountability-indicator">
            <span class="accountability-label">[un]accountable:</span>
            <span class="accountability-icon" id="accountability-icon">●</span>
          </span>
        </div>
      </header>

      <div id="monitor-shell">
        <div id="monitor-body">
          <aside id="control-rail">
            <div class="control-buttons">
              <button type="button" data-action="help">/help</button>
              <button type="button" data-action="back">back</button>
              <button type="button" data-action="map">map</button>
              <button type="button" data-action="login">login</button>
              <button type="button" data-action="contact">contact</button>
              <button type="button" data-action="faq">faq</button>
              <button type="button" data-action="inventory">inventory</button>
              <button type="button" data-action="kernel" class="kernel-btn" disabled>kernel</button>
              <button type="button" data-action="highscore">/highscore</button>
            </div>
            <div class="debrief-window" id="debrief-window" aria-label="Command and Conquer style debrief feed">
              <div class="debrief-label">debrief feed</div>
              <div class="debrief-screen" id="debrief-screen">
                <button id="mok-avatar" class="mok-avatar idle" type="button" aria-label="MOK avatar; click to ping advisory link">
                  <svg viewBox="0 0 220 120" class="mok-avatar-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                      <linearGradient id="mokDebriefGlow" x1="0" x2="1">
                        <stop offset="0" stop-color="#1cff9b" stop-opacity="0.85"/>
                        <stop offset="1" stop-color="#0d3f22" stop-opacity="0.65"/>
                      </linearGradient>
                    </defs>
                    <g transform="translate(110,60)" class="mok-avatar-glyph">
                      <path d="M-65 18 L0 -68 L65 18 Z" fill="none" stroke="url(#mokDebriefGlow)" stroke-width="4" stroke-linejoin="round" opacity="0.85"/>
                      <path d="M0 -58 L-20 22 L20 22 Z" fill="#21ff90" opacity="0.75" class="mok-avatar-core"/>
                      <line x1="0" y1="-78" x2="0" y2="-108" stroke="url(#mokDebriefGlow)" stroke-width="3" opacity="0.5"/>
                      <line x1="0" y1="34" x2="0" y2="84" stroke="url(#mokDebriefGlow)" stroke-width="3" opacity="0.5"/>
                    </g>
                  </svg>
                </button>
              </div>
            </div>
          </aside>

          <section id="log-column">
            <div class="log-frame">
              <!-- Terminal Output -->
              <div id="terminal">

                <!-- Input Line (hidden until activated) -->
                <div id="input-line" style="display: none;">
                  <span id="input-prompt">&gt; </span>
                  <span id="input-buffer"></span>
                  <span id="input-cursor"></span>
                </div>

                <!-- Hidden input for mobile keyboard support -->
                <input id="mobile-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input" />

              </div>
            </div>

            <!-- Inventory Grid (hidden by default) -->
            <div id="inventory-grid" class="inventory-grid" style="display: none;">
              <div class="inventory-label">INVENTORY</div>
              <div class="inventory-items" id="inventory-items">
                <!-- Inventory items will be populated here -->
              </div>
            </div>

            <div id="mok-interjections" aria-live="polite">
              <div class="interject-label">MOK INTERJECTION</div>
              <div class="interject-body" id="mok-interject-body">Standing by for advisories.</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- designation obsolete but still required -->

  <!--
    Script load order matches langterm pattern:
    Data/utility modules first, then orchestrator last.
    No build step. No bundler. No framework.
  -->
  <script src="js/terminal.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/highscore-state.js"></script>
  <script src="js/gamestate.js"></script>
  <script src="js/card-system.js"></script>
  <script src="js/lighting-system.js"></script>
  <script src="js/tooltip-system.js"></script>
  <script src="js/ground-effects.js"></script>
  <script src="js/secret-floors.js"></script>
  <script src="js/boss-encounters.js"></script>
  <script src="js/elite-enemies.js"></script>
  <script src="js/overhead-animator.js"></script>
  <script src="js/interactive-items.js"></script>
  <script src="js/item-spawner.js"></script>

  <!-- Agent Testing Integration -->
  <script src="tests/agent-headless-adapter.js"></script>
  <script src="js/agent-integration.js"></script>

  <script src="js/street-chronicles.js"></script>
  <script src="js/gone-rogue.js"></script>
  <script src="js/gone-rogue-mobile.js"></script>
  <script src="js/login-shell.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/state-machine.js"></script>
  <script src="js/main.js"></script>
  <script src="js/mok-ux.js"></script>
  <script src="js/ui-controls.js"></script>

</body>
</html>
