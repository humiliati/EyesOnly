<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws: https://*.cloudflareinsights.com; img-src 'self' data: blob: https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>EYES ONLY // M MODE</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #111;
      --surface2:  #1a1a1a;
      --border:    #2a2a2a;
      --text:      #33ff33;
      --text-dim:  #1a8a1a;
      --accent:    #33ff33;
      --red:       #ff3333;
      --amber:     #ffaa33;
      --blue:      #3399ff;
      --radius:    4px;
      --font:      'Courier New', Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: none;
    }
    #app { height: 100vh; display: flex; flex-direction: column; }

    /* --- Header bar --- */
    .m-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .m-header h1 { font-size: 13px; letter-spacing: 3px; color: var(--accent); }
    .m-header .meta { font-size: 10px; color: var(--text-dim); display: flex; gap: 12px; align-items: center; }
    .m-header .ws-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red); display: inline-block;
    }
    .m-header .ws-dot.on { background: var(--accent); }

    /* --- 3-column layout: Controls | Grid | Feed --- */
    .panels {
      flex: 1; display: grid;
      grid-template-columns: 260px 1fr 280px;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
    }
    .panel {
      background: var(--bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 5px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-dim);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-body { flex: 1; overflow-y: auto; }

    /* --- Lane Grid / Map --- */
    .map-container {
      position: relative; width: 100%; height: 100%;
      overflow: hidden;
    }
    .map-image {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0.35;
      pointer-events: none;
    }
    .lane-grid-overlay {
      position: relative;
      display: grid;
      gap: 2px;
      padding: 8px;
      width: 100%; height: 100%;
    }
    .lane-cell {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      padding: 6px 8px;
      display: flex; flex-direction: column;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
      min-height: 60px;
    }
    .lane-cell:hover { border-color: var(--accent); }
    .lane-cell .lane-label {
      font-size: 9px; letter-spacing: 2px; color: var(--text-dim);
      margin-bottom: 4px;
    }
    .lane-cell .lane-actors { font-size: 10px; flex: 1; }

    /* Lane color states */
    .lane-cell.state-green  { background: rgba(51,255,51,0.08); border-color: rgba(51,255,51,0.3); }
    .lane-cell.state-amber  { background: rgba(255,170,51,0.12); border-color: rgba(255,170,51,0.4); }
    .lane-cell.state-red    { background: rgba(255,51,51,0.12); border-color: rgba(255,51,51,0.4); }
    .lane-cell.state-blue   { background: rgba(51,153,255,0.12); border-color: rgba(51,153,255,0.4); }
    .lane-cell.state-green .lane-label  { color: var(--accent); }
    .lane-cell.state-amber .lane-label  { color: var(--amber); }
    .lane-cell.state-red .lane-label    { color: var(--red); }
    .lane-cell.state-blue .lane-label   { color: var(--blue); }

    /* --- Event feed --- */
    .feed { display: flex; flex-direction: column; gap: 2px; padding: 4px 8px; }
    .feed-item {
      padding: 3px 6px;
      border-left: 2px solid var(--border);
      font-size: 10px;
      line-height: 1.3;
    }
    .feed-item .ts { color: #444; font-size: 8px; margin-right: 3px; }
    .feed-item .actor { color: var(--blue); }
    .feed-item.checkin { border-left-color: var(--accent); }
    .feed-item.dead_drop_placed, .feed-item.dead_drop_retrieved { border-left-color: var(--amber); }
    .feed-item.escalation { border-left-color: var(--red); }

    /* --- Left column: stacked controls with collapsible categories --- */
    .ctrl-stack { display: flex; flex-direction: column; gap: 0; height: 100%; }
    .ctrl-section {
      background: var(--bg);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .ctrl-section h3 {
      font-size: 9px; letter-spacing: 2px; color: var(--text-dim);
      margin-bottom: 4px;
    }

    /* Collapsible category groups */
    .ctrl-category {
      border-bottom: 1px solid var(--border);
    }
    .ctrl-category-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px;
      background: var(--surface);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .ctrl-category-header:hover { background: var(--surface2); }
    .ctrl-category-header .cat-title {
      font-size: 9px; letter-spacing: 2px; color: var(--accent);
      font-weight: normal;
    }
    .ctrl-category-header .cat-chevron {
      font-size: 8px; color: var(--text-dim);
      transition: transform 0.2s;
    }
    .ctrl-category.collapsed .cat-chevron { transform: rotate(-90deg); }
    .ctrl-category-body {
      display: block;
      overflow: hidden;
    }
    .ctrl-category.collapsed .ctrl-category-body {
      display: none;
    }
    .ctrl-field { display: flex; flex-direction: column; gap: 1px; margin-bottom: 4px; }
    .ctrl-field label { font-size: 8px; color: #555; letter-spacing: 1px; }
    .ctrl-field input, .ctrl-field select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 11px;
      padding: 3px 6px; border-radius: 3px; outline: none; width: 100%;
    }
    .ctrl-field input:focus, .ctrl-field select:focus { border-color: var(--accent); }
    .ctrl-row { display: flex; gap: 4px; align-items: flex-end; }
    .ctrl-btn {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); font-family: var(--font); font-size: 9px;
      padding: 3px 8px; border-radius: 3px; cursor: pointer;
      letter-spacing: 1px; white-space: nowrap; width: 100%;
    }
    .ctrl-btn:hover { background: rgba(51,255,51,0.1); }
    .ctrl-btn.danger { border-color: var(--red); color: var(--red); }
    .ctrl-btn.danger:hover { background: rgba(255,51,51,0.1); }
    .ctrl-btn.amber { border-color: var(--amber); color: var(--amber); }

    /* --- Login overlay --- */
    .login-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .login-box {
      text-align: center;
      display: flex; flex-direction: column; gap: 12px; align-items: center;
    }
    .login-box h1 { font-size: 16px; letter-spacing: 4px; text-shadow: 0 0 10px var(--accent); }
    .login-box .sub { font-size: 10px; color: var(--text-dim); }
    .login-box input {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 14px;
      padding: 8px 12px; border-radius: var(--radius); outline: none;
      width: 240px; text-align: center;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box .error { color: var(--red); font-size: 11px; }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* --- Map upload dropzone --- */
    .map-dropzone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 12px; text-align: center; cursor: pointer;
      color: var(--text-dim); font-size: 10px;
      transition: border-color 0.2s;
    }
    .map-dropzone:hover { border-color: var(--accent); }
    .map-dropzone.dragover { border-color: var(--accent); background: rgba(51,255,51,0.05); }

    /* ========== UGRS GRID SYSTEM ========== */

    /* Grid container */
    .ugrs-grid {
      display: grid;
      gap: 1px;
      padding: 4px;
      height: 100%;
      position: relative;
      z-index: 1;
    }
    .ugrs-col-header {
      font-size: 8px;
      color: var(--text-dim);
      text-align: center;
      padding: 2px 0;
      letter-spacing: 1px;
    }
    .ugrs-row-header {
      font-size: 8px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }
    .ugrs-corner { /* top-left corner spacer */ }

    /* Grid cells */
    .ugrs-cell {
      position: relative;
      border: 1px solid var(--border);
      padding: 3px 4px;
      cursor: pointer;
      min-height: 36px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ugrs-cell:hover { border-color: var(--accent); z-index: 2; }
    .ugrs-cell.selected {
      border-color: var(--accent);
      border-width: 2px;
      box-shadow: 0 0 8px rgba(51,255,51,0.3);
      z-index: 3;
    }
    .ugrs-cell .ugrs-label {
      font-size: 7px;
      color: #444;
      position: absolute;
      top: 1px;
      left: 3px;
      pointer-events: none;
    }
    .ugrs-cell .ugrs-cell-content {
      margin-top: 10px;
      flex: 1;
    }

    /* Cell status colors */
    .ugrs-cell.st-working     { background: rgba(51,255,51,0.06); border-color: rgba(51,255,51,0.25); }
    .ugrs-cell.st-degraded    { background: rgba(255,170,51,0.10); border-color: rgba(255,170,51,0.35); }
    .ugrs-cell.st-compromised { background: rgba(255,51,51,0.10); border-color: rgba(255,51,51,0.35); }
    .ugrs-cell.st-offline     { background: rgba(100,100,100,0.08); border-color: rgba(100,100,100,0.3); }
    .ugrs-cell.st-unknown     { background: rgba(0,0,0,0.2); border-color: rgba(40,40,40,0.5); }

    /* Cell with actors (blue highlight) */
    .ugrs-cell.has-actors { box-shadow: inset 0 0 8px rgba(51,153,255,0.1); }

    /* Cell with scenario nodes */
    .ugrs-cell.has-nodes { border-style: dashed; }
    .scenario-node-marker { transition: transform 0.15s; }
    .scenario-node-marker:hover { transform: scale(1.4); }

    /* Cell lane indicator */
    .ugrs-cell .lane-tag {
      position: absolute;
      top: 1px; right: 3px;
      font-size: 6px;
      color: #555;
      letter-spacing: 1px;
    }

    /* Actor badges inside cells */
    .actor-badge {
      display: inline-block;
      font-size: 8px;
      padding: 0 3px;
      border-radius: 2px;
      margin: 1px;
      line-height: 1.4;
    }
    .actor-badge.team-red     { background: rgba(255,51,51,0.15); color: var(--red); }
    .actor-badge.team-blue    { background: rgba(51,153,255,0.15); color: var(--blue); }
    .actor-badge.team-director{ background: rgba(255,170,51,0.15); color: var(--amber); }

    /* Dead drop markers */
    .drop-marker {
      display: inline-block;
      font-size: 7px;
      color: var(--amber);
      margin: 1px;
    }

    /* Tension meter bar at cell bottom */
    .tension-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      transition: width 0.3s ease;
    }
    .tension-bar.t-low  { background: var(--accent); }
    .tension-bar.t-med  { background: var(--amber); }
    .tension-bar.t-high { background: var(--red); }

    /* Pulse animation for degraded/compromised cells */
    @keyframes cell-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .ugrs-cell.pulse { animation: cell-pulse 2s ease-in-out infinite; }

    /* ========== CALIBRATION UI ========== */
    .calibration-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
    }
    .calibration-overlay .cal-title {
      font-size: 12px; letter-spacing: 3px; color: var(--accent);
    }
    .calibration-overlay .cal-instruction {
      font-size: 10px; color: var(--text-dim); text-align: center;
    }
    .cal-preview-grid {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 10;
    }
    .cal-preview-grid .cal-line {
      position: absolute;
      background: rgba(51,255,51,0.15);
    }

    /* ========== FROZEN OVERLAY ========== */
    .frozen-overlay {
      position: absolute; inset: 0;
      background: rgba(255,51,51,0.04);
      display: flex; align-items: center; justify-content: center;
      z-index: 50;
      pointer-events: all;
      cursor: not-allowed;
    }
    .frozen-text {
      font-size: 18px;
      letter-spacing: 6px;
      color: var(--red);
      text-shadow: 0 0 20px rgba(255,51,51,0.4);
      text-transform: uppercase;
    }
    .m-header.frozen { border-bottom: 2px solid var(--red); }

    /* FREEZE button */
    .freeze-btn {
      background: none;
      border: 1px solid var(--red);
      color: var(--red);
      font-family: var(--font);
      font-size: 8px;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .freeze-btn:hover { background: rgba(255,51,51,0.1); }
    .freeze-btn.active {
      background: rgba(255,51,51,0.15);
      border-color: var(--red);
      text-shadow: 0 0 6px rgba(255,51,51,0.5);
    }

    /* ========== CONTEXT-SENSITIVE RIGHT PANEL ========== */
    .ctx-header {
      font-size: 14px;
      letter-spacing: 2px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
    }
    .ctx-back {
      font-size: 8px;
      color: var(--text-dim);
      cursor: pointer;
      letter-spacing: 1px;
      padding: 4px 8px;
      display: inline-block;
    }
    .ctx-back:hover { color: var(--accent); }
    .ctx-stat {
      display: flex;
      justify-content: space-between;
      padding: 3px 8px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .ctx-stat .value { color: var(--text); }
    .ctx-actions {
      display: flex; flex-direction: column; gap: 2px;
      padding: 4px 8px;
    }
    .ctx-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0;
    }
    .ctx-subtitle {
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--text-dim);
      padding: 4px 8px 2px;
    }

    /* Status badge */
    .status-badge {
      display: inline-block;
      font-size: 8px;
      padding: 1px 6px;
      border-radius: 2px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status-badge.st-working     { background: rgba(51,255,51,0.15); color: var(--accent); }
    .status-badge.st-degraded    { background: rgba(255,170,51,0.15); color: var(--amber); }
    .status-badge.st-compromised { background: rgba(255,51,51,0.15); color: var(--red); }
    .status-badge.st-offline     { background: rgba(100,100,100,0.15); color: #888; }
    .status-badge.st-unknown     { background: rgba(40,40,40,0.3); color: #666; }

    /* Tension display */
    .tension-display {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      margin: 4px 8px;
      overflow: hidden;
    }
    .tension-display .tension-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }

    /* Notes textarea */
    .ctx-notes {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      padding: 4px 6px;
      border-radius: 3px;
      resize: vertical;
      min-height: 40px;
      outline: none;
    }
    .ctx-notes:focus { border-color: var(--accent); }

    /* Move mode indicator */
    .move-mode-banner {
      background: rgba(51,153,255,0.1);
      border: 1px solid var(--blue);
      color: var(--blue);
      font-size: 9px;
      padding: 6px 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    /* Assign lane mode */
    .ugrs-cell.assign-highlight {
      border-color: var(--amber) !important;
      border-width: 2px;
    }

    /* ========== MOK HUD MINI ========== */
    .mok-hud-mini {
      display: inline-block;
      position: relative;
      pointer-events: none;
      image-rendering: optimizeQuality;
      -webkit-font-smoothing: antialiased;
      transition: opacity 220ms ease;
      width: 80px; height: 32px;
      vertical-align: middle;
    }
    .mok-svg { width: 100%; height: 100%; display: block; }

    /* Glyph animations by state */
    .mok-glyph { transform-origin: center; will-change: transform, opacity; }
    .mok-hud-mini.idle .mok-glyph { opacity: 0.55; transform: scale(0.98); }
    .mok-hud-mini.monitoring .mok-glyph { animation: mok-pulse 3.2s ease-in-out infinite; opacity: 0.85; }
    .mok-hud-mini.advisory .mok-glyph { animation: mok-pulse 1.6s ease-in-out 1; opacity: 1; }
    .mok-hud-mini.urgent .mok-glyph { animation: mok-urgent 0.55s linear infinite; opacity: 1; }
    .mok-hud-mini.engaged .mok-glyph { opacity: 1; filter: drop-shadow(0 0 6px rgba(0,255,170,0.22)); transform: scale(1.03); }

    /* Triangle core states */
    .mok-hud-mini.idle .mok-triangle-core { opacity: 0.0; }
    .mok-hud-mini.monitoring .mok-triangle-core { opacity: 0.12; animation: mok-breathe 3s ease-in-out infinite; }
    .mok-hud-mini.advisory .mok-triangle-core { animation: mok-flash 0.45s ease-in-out 3; opacity: 1; }
    .mok-hud-mini.urgent .mok-triangle-core { animation: mok-rapid 0.18s steps(2,end) infinite; opacity: 1; }
    .mok-hud-mini.engaged .mok-triangle-core { opacity: 1; filter: drop-shadow(0 0 6px rgba(0,255,150,0.28)); }

    /* Glow band */
    .mok-glow-band { will-change: transform, opacity; animation: mok-slide 6s linear infinite; }

    @keyframes mok-pulse {
      0% { transform: scale(1); opacity: 0.9; }
      45% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    @keyframes mok-urgent {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes mok-breathe {
      0% { opacity: 0.12; transform: scale(1); }
      50% { opacity: 0.22; transform: scale(1.03); }
      100% { opacity: 0.12; transform: scale(1); }
    }
    @keyframes mok-flash {
      0% { opacity: 0.0; }
      30% { opacity: 1; }
      60% { opacity: 0.0; }
      100% { opacity: 1; }
    }
    @keyframes mok-rapid {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes mok-slide {
      0% { transform: translateX(-80px); opacity: 0.06; }
      50% { transform: translateX(40px); opacity: 0.10; }
      100% { transform: translateX(220px); opacity: 0.06; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mok-glow-band, .mok-glyph, .mok-triangle-core { animation: none !important; }
    }

    /* MOK squelch controls */
    .mok-squelch {
      display: flex; gap: 2px; margin-left: 4px;
      pointer-events: auto;
    }
    .mok-squelch button {
      background: none; border: 1px solid #333;
      color: #555; font-family: var(--font);
      font-size: 6px; padding: 1px 4px;
      cursor: pointer; border-radius: 2px;
      letter-spacing: 0.5px; line-height: 1.2;
    }
    .mok-squelch button:hover { color: var(--accent); border-color: var(--accent); }
    .mok-squelch button.active { color: var(--accent); border-color: var(--accent); background: rgba(51,255,51,0.08); }

    /* ========== OPERATION BAR ========== */
    .op-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 3px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      letter-spacing: 1px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .op-bar .op-metric {
      display: flex; gap: 4px; align-items: center;
    }
    .op-bar .op-label { color: #444; }
    .op-bar .op-value { color: var(--text); }
    .op-bar .op-value.threat-low { color: var(--accent); }
    .op-bar .op-value.threat-optimal { color: var(--amber); }
    .op-bar .op-value.threat-high { color: var(--red); }
    .op-bar .op-value.threat-critical { color: var(--red); text-shadow: 0 0 6px rgba(255,51,51,0.5); }

    /* ========== MOK FEED ========== */
    .mok-feed-panel {
      display: flex; flex-direction: column;
      max-height: 140px; min-height: 60px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .mok-feed-header {
      padding: 3px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 8px;
      letter-spacing: 2px;
      color: #444;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .mok-feed-body {
      flex: 1; overflow-y: auto;
      padding: 2px 8px;
      background: rgba(0,0,0,0.3);
    }
    .mok-msg {
      padding: 2px 0;
      font-size: 9px;
      line-height: 1.3;
      border-bottom: 1px solid rgba(40,40,40,0.3);
    }
    .mok-msg .mok-ts { color: #333; font-size: 7px; margin-right: 3px; }
    .mok-msg .mok-tag { font-weight: bold; margin-right: 3px; }
    .mok-msg.mok-advisory .mok-tag { color: var(--text-dim); }
    .mok-msg.mok-warning .mok-tag { color: var(--amber); }
    .mok-msg.mok-directive .mok-tag { color: var(--accent); }
    .mok-msg.mok-critical .mok-tag { color: var(--red); }
    .mok-msg.mok-critical { background: rgba(255,51,51,0.04); }

    /* ========== ESCALATION PRESETS ========== */
    .escalation-presets {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
    }

    /* ========== VIDEO PUSH WIDGET ========== */
    .video-push-widget {
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      background: var(--surface);
    }
    .video-push-widget h3 {
      font-size: 9px; letter-spacing: 2px; color: var(--amber);
      margin-bottom: 4px;
    }
    .video-push-select {
      width: 100%;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--font); font-size: 10px;
      padding: 3px 6px; border-radius: 3px; outline: none;
      margin-bottom: 4px;
    }
    .video-push-select:focus { border-color: var(--accent); }
    .video-push-btns {
      display: flex; flex-direction: column; gap: 2px;
    }
    .video-push-btns .ctrl-btn {
      font-size: 9px; padding: 4px 8px; text-align: center;
    }
    .video-push-btns .ctrl-btn:disabled {
      opacity: 0.3; cursor: not-allowed;
    }
    .video-push-status {
      font-size: 8px; color: var(--text-dim); margin-top: 3px;
      min-height: 12px;
    }
    .video-push-status.ok { color: var(--accent); }
    .video-push-status.err { color: var(--red); }
  </style>
