<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws: https://*.cloudflareinsights.com; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>EYES ONLY // OPS</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --border:    #2a2a2a;
      --text:      #33ff33;
      --text-dim:  #1a8a1a;
      --accent:    #33ff33;
      --red:       #ff3333;
      --amber:     #ffaa33;
      --blue:      #3399ff;
      --radius:    6px;
      --font:      'Courier New', Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: none;
    }
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 { font-size: 14px; letter-spacing: 2px; }
    .header .status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid var(--accent);
    }
    .header .status.offline { border-color: var(--red); color: var(--red); }

    /* --- Screens --- */
    .screen { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* --- Join screen --- */
    .join-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      text-align: center;
    }
    .join-screen .logo {
      font-size: 20px; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--accent);
    }
    .join-screen .subtitle { color: var(--text-dim); font-size: 12px; }

    /* --- Form elements --- */
    .field { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 320px; }
    .field label { font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px; /* prevents iOS zoom */
      padding: 10px 12px;
      border-radius: var(--radius);
      outline: none;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(51,255,51,0.2); }

    .btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 14px;
      padding: 12px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      width: 100%; max-width: 320px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:active { background: var(--accent); color: var(--bg); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:active { background: var(--red); color: var(--bg); }

    /* --- Dashboard --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }
    .card h2 { font-size: 12px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; }
    .card .value { font-size: 18px; }

    .stat-row { display: flex; gap: 12px; }
    .stat-row .card { flex: 1; }

    /* --- Event feed --- */
    .events { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .event-item {
      padding: 6px 10px;
      border-left: 2px solid var(--border);
      font-size: 12px;
    }
    .event-item .time { color: var(--text-dim); font-size: 10px; }
    .event-item.checkin { border-left-color: var(--accent); }
    .event-item.dead_drop { border-left-color: var(--amber); }
    .event-item.escalation { border-left-color: var(--red); }

    /* --- Lane grid (SVG) --- */
    .lane-grid { width: 100%; }
    .lane-grid svg { width: 100%; height: auto; }

    /* --- Nav bar --- */
    .nav {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .nav button {
      flex: 1;
      background: none; border: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 10px;
      padding: 10px 0;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .nav button.active { color: var(--accent); border-top: 2px solid var(--accent); }

    /* --- Error/alert --- */
    .error-msg { color: var(--red); font-size: 12px; text-align: center; }

    /* --- Loading --- */
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
