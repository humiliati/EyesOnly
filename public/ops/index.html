<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' wss: ws: https://*.cloudflareinsights.com; img-src 'self' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>EYES ONLY // OPS</title>
  <style>
    :root {
      --bg:        #0a0a0a;
      --surface:   #141414;
      --border:    #2a2a2a;
      --text:      #33ff33;
      --text-dim:  #1a8a1a;
      --accent:    #33ff33;
      --red:       #ff3333;
      --amber:     #ffaa33;
      --blue:      #3399ff;
      --radius:    6px;
      --font:      'Courier New', Courier, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: none;
    }
    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 { font-size: 14px; letter-spacing: 2px; }
    .header .status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid var(--accent);
    }
    .header .status.offline { border-color: var(--red); color: var(--red); }

    /* --- Screens --- */
    .screen { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* --- Join screen --- */
    .join-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      text-align: center;
    }
    .join-screen .logo {
      font-size: 20px; letter-spacing: 4px;
      text-shadow: 0 0 10px var(--accent);
    }
    .join-screen .subtitle { color: var(--text-dim); font-size: 12px; }

    /* --- Form elements --- */
    .field { display: flex; flex-direction: column; gap: 4px; width: 100%; max-width: 320px; }
    .field label { font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px; /* prevents iOS zoom */
      padding: 10px 12px;
      border-radius: var(--radius);
      outline: none;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(51,255,51,0.2); }

    .btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 14px;
      padding: 12px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      width: 100%; max-width: 320px;
      transition: background 0.2s, color 0.2s;
    }
    .btn:active { background: var(--accent); color: var(--bg); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:active { background: var(--red); color: var(--bg); }

    /* --- Dashboard --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
    }
    .card h2 { font-size: 12px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; }
    .card .value { font-size: 18px; }

    .stat-row { display: flex; gap: 12px; }
    .stat-row .card { flex: 1; }

    /* --- Event feed --- */
    .events { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .event-item {
      padding: 6px 10px;
      border-left: 2px solid var(--border);
      font-size: 12px;
    }
    .event-item .time { color: var(--text-dim); font-size: 10px; }
    .event-item.checkin { border-left-color: var(--accent); }
    .event-item.dead_drop { border-left-color: var(--amber); }
    .event-item.escalation { border-left-color: var(--red); }

    /* --- Lane grid (SVG) --- */
    .lane-grid { width: 100%; }
    .lane-grid svg { width: 100%; height: auto; }

    /* --- Nav bar --- */
    .nav {
      display: flex;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .nav button {
      flex: 1;
      background: none; border: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 10px;
      padding: 10px 0;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .nav button.active { color: var(--accent); border-top: 2px solid var(--accent); }

    /* --- Error/alert --- */
    .error-msg { color: var(--red); font-size: 12px; text-align: center; }

    /* --- Loading --- */
    .loading { text-align: center; padding: 40px; color: var(--text-dim); }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ========== M PING DIRECTIVES ========== */
    .ping-flash {
      position: fixed; inset: 0;
      background: rgba(255,51,51,0.08);
      z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px;
      animation: ping-in 0.3s ease-out;
    }
    @keyframes ping-in {
      0% { opacity: 0; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .ping-flash .ping-label {
      font-size: 10px; letter-spacing: 3px;
      color: var(--red); text-transform: uppercase;
    }
    .ping-flash .ping-command {
      font-size: 28px; letter-spacing: 6px;
      color: var(--text);
      text-shadow: 0 0 20px rgba(51,255,51,0.4);
    }
    .ping-flash .ping-detail {
      font-size: 12px; color: var(--text-dim);
      text-align: center; max-width: 280px;
    }
    .ping-flash .ping-timer {
      font-size: 24px; color: var(--red);
      font-variant-numeric: tabular-nums;
    }
    .ping-flash .ping-ack-btn {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: var(--font);
      font-size: 16px;
      padding: 14px 40px;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    .ping-flash .ping-ack-btn:active {
      background: var(--accent); color: var(--bg);
    }

    /* Pending pings list */
    .ping-item {
      padding: 8px 12px;
      border: 1px solid var(--red);
      border-radius: var(--radius);
      margin-bottom: 8px;
      background: rgba(255,51,51,0.04);
    }
    .ping-item.acked {
      border-color: var(--accent);
      background: rgba(51,255,51,0.04);
      opacity: 0.6;
    }
    .ping-item .ping-cmd {
      font-size: 14px; letter-spacing: 2px; font-weight: bold;
    }
    .ping-item .ping-meta {
      font-size: 10px; color: var(--text-dim); margin-top: 2px;
    }

    /* ========== MOK BROADCAST BANNER ========== */
    .ops-broadcast {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,20,0,0.95);
      border-bottom: 2px solid var(--accent);
      padding: 12px 16px;
      z-index: 150;
      text-align: center;
      cursor: pointer;
      animation: broadcast-in 0.4s ease-out;
      transition: opacity 0.5s;
    }
    @keyframes broadcast-in {
      0% { transform: translateY(-100%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .ops-broadcast .broadcast-label {
      font-size: 8px; letter-spacing: 3px;
      color: var(--text-dim); margin-bottom: 4px;
    }
    .ops-broadcast .broadcast-msg {
      font-size: 14px; color: var(--accent);
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(51,255,51,0.3);
    }

    /* ========== OPS CONTEXT BAR ========== */
    .ops-context-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
    }
    .ops-context-bar .ctx-row {
      display: flex; gap: 8px; margin-bottom: 4px;
    }
    .ops-context-bar .ctx-item {
      flex: 1;
      display: flex; flex-direction: column; gap: 1px;
    }
    .ops-context-bar .ctx-label {
      font-size: 8px; letter-spacing: 1px; color: #555;
    }
    .ops-context-bar .ctx-val {
      font-size: 13px; color: var(--accent); font-weight: bold;
    }
    .ctx-tension-bar {
      height: 3px; background: var(--border); border-radius: 2px;
      margin: 4px 0 2px; overflow: hidden;
    }
    .ctx-tension-fill {
      height: 100%; width: 0%;
      transition: width 0.5s, background 0.3s;
      border-radius: 2px;
      background: var(--accent);
    }
    .ctx-last-ping {
      font-size: 10px; color: var(--text-dim);
      padding: 4px 0 0;
      border-top: 1px solid rgba(40,40,40,0.5);
      margin-top: 4px;
    }

    /* Frozen overlay for ops */
    .ops-frozen-overlay {
      position: fixed; inset: 0;
      background: rgba(255,51,51,0.06);
      z-index: 300;
      display: flex; align-items: center; justify-content: center;
      pointer-events: all; cursor: not-allowed;
    }
    .ops-frozen-overlay .frozen-msg {
      font-size: 20px; letter-spacing: 6px;
      color: var(--red);
      text-shadow: 0 0 20px rgba(255,51,51,0.4);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-msg" style="color:#33ff33;font-family:monospace;padding:40px;text-align:center;">
      <div style="font-size:16px;letter-spacing:4px;margin-bottom:12px;">OPS</div>
      <div style="font-size:10px;color:#1a8a1a;">INITIALIZING...</div>
    </div>
  </div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('boot-msg') || document.getElementById('app');
      el.innerHTML = '<div style="color:#ff3333;font-family:monospace;padding:40px;text-align:center;">' +
        '<div style="font-size:14px;margin-bottom:8px;">SYSTEM FAULT</div>' +
        '<div style="font-size:11px;color:#aa2222;word-break:break-all;">' + msg + '</div>' +
        '<div style="font-size:9px;color:#662222;margin-top:8px;">' + (src||'') + ':' + (line||'') + ':' + (col||'') + '</div>' +
        '</div>';
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
