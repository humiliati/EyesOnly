<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene Asset Designer Portal</title>
  <link rel="stylesheet" href="css/asset-designer.css">
</head>
<body>
  <div class="portal-container">
    <header class="portal-header">
      <h1>🎨 SCENE ASSET DESIGNER PORTAL</h1>
      <div class="header-actions">
        <button id="new-asset-btn" class="btn-primary">+ New Asset</button>
        <button id="save-btn" class="btn-secondary">💾 Save</button>
        <button id="load-btn" class="btn-secondary">📂 Load</button>
      </div>
    </header>

    <div class="portal-main">
      <!-- Left Panel: Asset Library -->
      <aside class="asset-library">
        <h2>Asset Library</h2>
        <div class="library-section">
          <h3>📁 Furniture</h3>
          <div class="asset-list" data-category="furniture">
            <button class="asset-item" data-asset="DESK_CLUSTER_OFFICE">Desk</button>
            <button class="asset-item" data-asset="CHAIR_BASIC">Chair</button>
            <button class="asset-item" data-asset="COMPUTER_SETUP">Computer</button>
          </div>
        </div>

        <div class="library-section">
          <h3>📁 Nature</h3>
          <div class="asset-list" data-category="nature">
            <button class="asset-item" data-asset="TREE_BASIC">Tree</button>
            <button class="asset-item" data-asset="FLOWER_CLUSTER">Flower</button>
            <button class="asset-item" data-asset="ROCK_CLUSTER">Rock</button>
          </div>
        </div>

        <div class="library-section">
          <h3>📁 Structure</h3>
          <div class="asset-list" data-category="structure">
            <button class="asset-item" data-asset="WALL_DECORATION">Wall</button>
            <button class="asset-item" data-asset="DOOR_BASIC">Door</button>
            <button class="asset-item" data-asset="WINDOW_BASIC">Window</button>
          </div>
        </div>

        <div class="library-section">
          <h3>📁 Abstract</h3>
          <div class="asset-list" data-category="abstract">
            <button class="asset-item" data-asset="GLOW_EFFECT">Glow</button>
          </div>
        </div>

        <button id="add-asset-btn" class="btn-add">+ New Asset</button>
      </aside>

      <!-- Center Panel: Canvas Preview -->
      <section class="canvas-section">
        <h2>Canvas Preview</h2>
        <div class="canvas-container">
          <canvas id="preview-canvas" width="600" height="400"></canvas>
          <div class="canvas-overlay" id="selection-indicator"></div>
        </div>

        <div class="canvas-controls">
          <label>
            Zoom: <input type="range" id="zoom-slider" min="50" max="200" value="100">
            <span id="zoom-value">100%</span>
          </label>
          <label>
            <input type="checkbox" id="grid-toggle" checked> Show Grid
          </label>
          <label>
            Seed: <input type="number" id="seed-input" value="12345" style="width: 100px">
          </label>
          <button id="test-density-btn" class="btn-secondary">Test Density</button>
        </div>

        <!-- Emoji Palette -->
        <div class="emoji-palette">
          <h3>Add Emoji</h3>
          <div class="emoji-grid">
            <button class="emoji-btn">💻</button>
            <button class="emoji-btn">☕</button>
            <button class="emoji-btn">📎</button>
            <button class="emoji-btn">📃</button>
            <button class="emoji-btn">🪑</button>
            <button class="emoji-btn">🚪</button>
            <button class="emoji-btn">🪟</button>
            <button class="emoji-btn">🌳</button>
            <button class="emoji-btn">🌸</button>
            <button class="emoji-btn">🪨</button>
            <button class="emoji-btn">✨</button>
            <button class="emoji-btn">💡</button>
            <button class="emoji-btn">🔥</button>
            <button class="emoji-btn">💧</button>
            <button class="emoji-btn">🍃</button>
            <button class="emoji-btn">⭐</button>
          </div>
          <input type="text" id="custom-emoji" placeholder="Or enter custom emoji" maxlength="2">
        </div>
      </section>

      <!-- Right Panel: Properties -->
      <aside class="properties-panel">
        <h2>Properties</h2>
        <div id="properties-content">
          <div class="prop-group">
            <label>Asset ID:</label>
            <input type="text" id="asset-id" value="DESK_CLUSTER_OFFICE">
          </div>

          <div class="prop-group">
            <label>Name:</label>
            <input type="text" id="asset-name" value="Office Desk Cluster">
          </div>

          <div class="prop-group">
            <label>Category:</label>
            <select id="asset-category">
              <option value="furniture">Furniture</option>
              <option value="nature">Nature</option>
              <option value="structure">Structure</option>
              <option value="abstract">Abstract</option>
            </select>
          </div>

          <div class="prop-group">
            <label>Valid Tiles:</label>
            <input type="text" id="valid-tiles" value="FLOOR_OFFICE, FLOOR_CORRIDOR" placeholder="Comma-separated">
          </div>

          <div class="prop-group">
            <label>Density: <span id="density-value">40%</span></label>
            <input type="range" id="density-slider" min="0" max="100" value="40">
          </div>

          <div class="prop-group">
            <label>Scatter: <span id="scatter-value">60%</span></label>
            <input type="range" id="scatter-slider" min="0" max="100" value="60">
          </div>

          <div class="prop-group">
            <label>Layers:</label>
            <div id="layers-list">
              <div class="layer-item" data-layer="base">
                <span>🔵 Base</span>
                <input type="number" value="0" class="layer-z" min="-10" max="10">
              </div>
              <div class="layer-item" data-layer="surface">
                <span>🟢 Surface</span>
                <input type="number" value="4" class="layer-z" min="-10" max="10">
              </div>
              <div class="layer-item" data-layer="floating">
                <span>🟡 Floating</span>
                <input type="number" value="8" class="layer-z" min="-10" max="10">
              </div>
            </div>
          </div>

          <div class="prop-group">
            <label>Animation on Place:</label>
            <select id="anim-place">
              <option value="slideUp">Slide Up</option>
              <option value="pop">Pop</option>
              <option value="none">None</option>
              <option value="fade">Fade In</option>
            </select>
          </div>

          <div class="prop-group">
            <label>
              <input type="checkbox" id="shadows-toggle" checked> Shadows
            </label>
          </div>

          <hr>

          <h3>Selected Emoji</h3>
          <div id="emoji-properties" class="emoji-props">
            <p class="hint">Click an emoji on canvas to edit</p>
          </div>

          <div class="action-buttons">
            <button id="export-btn" class="btn-primary">📤 Export to Registry</button>
            <button id="duplicate-btn" class="btn-secondary">📋 Duplicate</button>
            <button id="delete-emoji-btn" class="btn-danger">🗑️ Delete Selected</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Density Test Modal -->
  <div id="density-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Density Test</h2>
        <button class="modal-close">&times;</button>
      </div>
      <canvas id="density-canvas" width="800" height="600"></canvas>
      <div class="modal-controls">
        <label>Seed: <input type="number" id="density-seed" value="12345"></label>
        <button id="regenerate-density">Regenerate</button>
      </div>
    </div>
  </div>

  <script src="js/asset-cluster-registry.js"></script>
  <script src="js/asset-editor.js"></script>
  <script src="js/asset-preview-renderer.js"></script>
  <script src="js/density-tester.js"></script>
  <script>
    // Initialize portal
    document.addEventListener('DOMContentLoaded', function() {
      window.assetEditor = new AssetEditor(document.getElementById('preview-canvas'));
      console.log('[AssetDesigner] Portal initialized');
    });
  </script>
</body>
</html>
