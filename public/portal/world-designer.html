<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Designer</title>
    <link rel="stylesheet" href="css/map-designer.css"> <!-- Re-using the same CSS for now -->
</head>
<body>
    <header class="designer-header">
        <h1>World Designer</h1>
        <div class="header-controls">
            <select id="world-selector" class="floor-selector"></select>
            <button id="import-world-btn" class="btn btn-primary">Import World</button>
            <input type="file" id="import-file" accept=".json" style="display:none;">
            <button id="export-world-btn" class="btn btn-primary">Export World</button>
        </div>
    </header>

    <div class="designer-container">
        <aside class="palette-sidebar">
            <div class="palette-section">
                <h3>World Tools</h3>
                <div class="palette-grid">
                    <button class="palette-btn" data-tool="add-floor" title="Add Floor">Add Floor</button>
                    <button class="palette-btn" data-tool="add-building" title="Add Building">Add Building</button>
                </div>
            </div>
            <div class="palette-section">
                <h3>SFC Nodes</h3>
                <div class="palette-grid">
                    <button class="palette-btn" data-tool="add-step" title="Add Step">Add Step</button>
                    <button class="palette-btn" data-tool="add-transition" title="Add Transition">Add Transition</button>
                    <button class="palette-btn" data-tool="add-parallel" title="Add Parallel Branch">Add Parallel</button>
                    <button class="palette-btn" data-tool="add-convergence" title="Add Convergence">Add Convergence</button>
                </div>
            </div>
        </aside>

        <main class="canvas-area">
            <div id="world-canvas" style="width: 100%; height: 100%; position: relative;"></div>
        </main>

        <aside class="property-inspector">
            <h3>Properties</h3>
            <div id="inspector-content">
                <div class="inspector-empty">
                    <p>Select a node to view properties</p>
                </div>
            </div>
        </aside>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPlumb/2.15.6/js/jsplumb.min.js"></script>
    <script src="js/world-designer.js"></script>
</body>
</html>
