<!DOCTYPE html>
<html>
<head>
<style>
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.card {
  width: 290px; height: 480px; border-radius: 16px; position: relative;
  background: linear-gradient(175deg, #1a1810 0%, #221e14 25%, #1e1a10 50%, #1a1608 75%, #14120a 100%);
  display: flex; flex-direction: column; overflow: hidden;
  border: 5px solid #2a2418;
}
.artwork {
  flex: 0 1 48%; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; min-height: 0;
}
/* BEFORE fix - no filter */
.before .starfield-window {
  position: absolute; width: 82%; aspect-ratio: 1; border-radius: 50%; z-index: 0;
  background: #020112;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 8px rgba(20,10,40,0.3);
}
/* AFTER fix - with filter + stronger shadows */
.after .starfield-window {
  position: absolute; width: 82%; aspect-ratio: 1; border-radius: 50%; z-index: 0;
  background: #020112;
  filter: brightness(3) saturate(1.6);
  box-shadow:
    inset 0 0 18px 4px rgba(2,4,20,0.95),
    inset 0 0 6px 1px rgba(30,40,80,0.5),
    0 0 12px 2px rgba(20,25,60,0.35),
    0 0 4px rgba(60,80,140,0.15);
}
.rings {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(circle at center,
      transparent 0%, transparent 46%,
      rgba(0,0,0,0.82) 46%, rgba(0,0,0,0.72) 48%,
      rgba(0,0,0,0.62) 48%, rgba(0,0,0,0.58) 50.5%,
      rgba(0,0,0,0.56) 50.5%, rgba(0,0,0,0.48) 52.5%,
      rgba(0,0,0,0.40) 52.5%, rgba(0,0,0,0.36) 55%,
      rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.28) 57%,
      rgba(0,0,0,0.22) 57%, rgba(0,0,0,0.19) 59.5%,
      rgba(0,0,0,0.18) 59.5%, rgba(0,0,0,0.14) 61.5%,
      rgba(0,0,0,0.09) 61.5%, rgba(0,0,0,0.07) 64%,
      rgba(0,0,0,0.07) 64%, rgba(0,0,0,0.04) 66.5%,
      rgba(0,0,0,0.03) 66.5%, rgba(0,0,0,0.02) 68.5%,
      transparent 75%, transparent 100%
    ),
    radial-gradient(circle at center,
      transparent 0%, transparent 45.5%,
      rgba(180,150,60,0.25) 46%, rgba(180,150,60,0.25) 48.5%, transparent 49.5%,
      transparent 52%, rgba(180,150,60,0.15) 52.5%, transparent 53.5%,
      transparent 56.5%, rgba(180,150,60,0.15) 57%, transparent 58%,
      transparent 61%, rgba(180,150,60,0.15) 61.5%, transparent 62.5%,
      transparent 100%
    );
}
.suit { position: relative; z-index: 5; font-size: 70px; color: rgba(180,150,60,0.9);
  text-shadow: 0 4px 8px rgba(0,0,0,0.7); }
.label { color: #aaa; text-align: center; font-family: monospace; padding: 10px; position: absolute; top: -30px; left: 0; right: 0; }
.container { display: flex; gap: 60px; align-items: flex-start; position: relative; }
</style>
</head>
<body>
<div class="container">
  <div style="position:relative">
    <div class="label">BEFORE (no porthole)</div>
    <div class="card before">
      <div class="artwork">
        <canvas class="starfield-window" width="200" height="200" id="cv1"></canvas>
        <div class="rings"></div>
        <div class="suit">&#9827;</div>
      </div>
    </div>
  </div>
  <div style="position:relative">
    <div class="label">AFTER (porthole visible)</div>
    <div class="card after">
      <div class="artwork">
        <canvas class="starfield-window" width="200" height="200" id="cv2"></canvas>
        <div class="rings"></div>
        <div class="suit">&#9827;</div>
      </div>
    </div>
  </div>
</div>
<script>
// Simulate the starfield rendering on both canvases
function paintStarfield(canvas) {
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  // Deep space base
  ctx.fillStyle = '#020112';
  ctx.fillRect(0, 0, W, H);
  // Nebula glow
  var grd = ctx.createRadialGradient(W*0.35, H*0.4, 0, W*0.35, H*0.4, W*0.6);
  grd.addColorStop(0, 'rgba(15,8,35,0.2)');
  grd.addColorStop(0.4, 'rgba(8,4,20,0.1)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  // Stars - matching the original layer defs
  var layers = [
    {count:600, rMin:0.3, rMax:0.5, opacity:0.25},
    {count:120, rMin:0.4, rMax:0.7, opacity:0.45},
    {count:45, rMin:0.6, rMax:1.2, opacity:0.7},
    {count:15, rMin:1.0, rMax:1.8, opacity:0.85}
  ];
  layers.forEach(function(l) {
    for (var i = 0; i < l.count; i++) {
      var x = Math.random() * W;
      var y = Math.random() * H;
      var r = l.rMin + Math.random() * (l.rMax - l.rMin);
      var a = l.opacity * (0.5 + Math.random() * 0.5);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(200,210,255,' + a + ')';
      ctx.fill();
    }
  });
  // Vignette
  var vig = ctx.createRadialGradient(W/2, H/2, W*0.35, W/2, H/2, W*0.5);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(0.6, 'rgba(4,3,8,0.3)');
  vig.addColorStop(1, 'rgba(10,8,16,0.85)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}
paintStarfield(document.getElementById('cv1'));
paintStarfield(document.getElementById('cv2'));
</script>
</body>
</html>
